<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="stylesheet" href="/src/scss/styles.scss" />
    <script src="https://cdn.jsdelivr.net/gh/rick-liruixin/body-scroll-lock-upgrade@v1.1.0/lib/index.umd.js"></script>
    <title>Scoot</title>
  </head>
  <body>
    <header class="header wrapper">
      <a class="header__logo" href="">
        <img
          src="/src/assets/icons/logo.svg"
          alt="scoot"
          width="108"
          height="29"
        />
      </a>
      <nav class="header__nav">
        <span id="nav-label" hidden>Navigation</span>
        <button
          class="header__open"
          aria-expanded="false"
          aria-labelledby="nav-label"
        >
          <img
            src="/src/assets/icons/hamburger.svg"
            alt=""
            width="20"
            height="16"
          />
        </button>
        <div class="header__menu" role="dialog" aria-labelledby="nav-label">
          <button class="header__close" aria-label="Close">
            <img
              src="/src/assets/icons/close.svg"
              alt=""
              width="18"
              height="18"
            />
          </button>
          <div class="header__content">
            <ul class="header__links">
              <li>
                <a href="/about" class="header__link">About</a>
              </li>
              <li>
                <a href="/location" class="header__link">Location</a>
              </li>
              <li>
                <a href="/careers" class="header__link">Careers</a>
              </li>
            </ul>
            <a href="" class="header__button button">Get Scootin</a>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="hero wrapper">
        <picture class="hero__picture fullbleed">
          <source
            media="(width >= 68.75em)"
            srcset="/src/assets/images/home-hero-desktop.jpg"
            width="1440"
            height="650"
          />
          <source
            media="(width >= 43.75em)"
            srcset="/src/assets/images/home-hero-tablet.jpg"
            width="768"
            height="650"
          />
          <img
            class="hero__image"
            src="/src/assets/images/home-hero-mobile.jpg"
            alt="man riding yellow scooter on bridge"
            width="375"
            height="650"
          />
        </picture>
        <div class="hero__content">
          <h1>Scooter sharing made simple</h1>
          <p>
            Scoot takes the hassle out of urban mobility. Our bikes are placed
            in convenient locations in each of our cities. Use our app to locate
            the nearest bike, unlock it with a tap, and you’re away!
          </p>
          <a href="" class="button white">Get Scootin</a>
        </div>
        <img
          class="hero__line"
          src="/src/assets/patterns/line.svg"
          alt=""
          width="203"
          height="15"
        />
        <img
          class="hero__arrow"
          src="/src/assets/patterns/right-arrow.svg"
          alt=""
          width="452"
          height="151"
        />
        <img
          class="hero__circles fullbleed"
          src="/src/assets/patterns/white-circles.svg"
          alt=""
          width="234"
          height="63"
        />
      </section>
    </main>
    <script type="module" src="/src/js/script.js"></script>
  </body>
</html>
